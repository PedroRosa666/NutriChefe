# Confere cada push e pull request: tipos, lint, testes (com banco de teste em memória),
# build do site e tipos das Edge Functions (Deno). Não usa segredos nem acessa produção.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vitest run
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
